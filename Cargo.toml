[package]
name = "rebalance-app"
version = "2.0.0"
authors = ["Alberto Leal <mailforalberto@gmail.com>"]
edition = "2021"

[dependencies]
csv        = "1.3"
tabwriter  = "1.2"
num        = "0.4"
chrono     = { version = "0.4", features = ["serde"] }
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
toml       = "0.8"
anyhow     = "1"

[dev-dependencies]
tempfile   = "3"
